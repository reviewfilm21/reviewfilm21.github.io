<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<script>
(function () {
    var path = location.pathname + location.search + location.hash;
    try { sessionStorage.setItem('redirectPath', path); } catch (e) {}
    location.replace('/');
})();
</script>
