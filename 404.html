<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Simpan path yang diminta ke sessionStorage
        sessionStorage.setItem('redirectPath', location.pathname + location.search);
        // Alihkan ke halaman utama
        location.replace('/');
    </script>
    <style>
        body { background: #09090b; color: #f4f4f5; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
    </style>
</head>
<body>
    <p>Mengalihkan ke halaman utama...</p>
</body>
</html>
