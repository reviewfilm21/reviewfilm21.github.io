    <script>
        // ================= KONSTANTA & STATE =================
        const DEFAULT_API_KEY_ENCODED = "ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SmhaR1FpT2lJeFlqRmtNbU5tTVdSbU1EVTNZekpsTm1FeE1UQTRPR1kzTlRCa01EQTFOU0lzSW01aVppSTZNVGM0T0RVeE9UQTJOaTQzTURVNU9UazVMQ0p6ZFdJaU9pSTJZVGxoWVRJNVlUQXlNREZrTmpnelVURTJaVFpsWldZaUxDSnpZMjl3WlhKeklqcGJJaUZ3YVY5eVpXRmtJaXdpWlhKemFXNW5aWE1pTENKcGJtbDBhVzl1SWl3aVpXMXBibWx1WnlKZC5NMUUwbkl0d2pmdkczN1Z2bFlfR2EtdGFySTF2eEtWU2t4ZkpMWmV2ZHhUOA==";
        const DEFAULT_API_KEY = atob(DEFAULT_API_KEY_ENCODED);
        const MOVIES_JSON_URL = './movies.json'; // URL untuk movies.json
        
        // ... (state, fungsi utilitas, dll sama seperti sebelumnya) ...

        // ================= FUNGSI BARU: LOAD MOVIES.JSON =================
        async function loadMoviesFromJSON() {
            console.log('🔄 Mencoba load data dari movies.json...');
            
            try {
                const response = await fetch(MOVIES_JSON_URL, {
                    cache: 'no-cache',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    console.warn(`⚠️ movies.json tidak ditemukan (status: ${response.status})`);
                    return false;
                }
                
                const data = await response.json();
                console.log('📦 Data movies.json diterima:', data);
                
                let dataLoaded = false;
                
                // Load trending data
                if (data.trending && Array.isArray(data.trending) && data.trending.length > 0) {
                    state.trendingData = data.trending.map(normalizeJSONItem).filter(Boolean);
                    state.heroItems = state.trendingData.slice(0, 5);
                    dataLoaded = true;
                    console.log(`✅ Trending: ${state.trendingData.length} items`);
                }
                
                // Load movies data
                if (data.movies && Array.isArray(data.movies) && data.movies.length > 0) {
                    state.moviesData = data.movies.map(normalizeJSONItem).filter(Boolean);
                    dataLoaded = true;
                    console.log(`✅ Movies: ${state.moviesData.length} items`);
                }
                
                // Load TV shows data
                if (data.tvShows && Array.isArray(data.tvShows) && data.tvShows.length > 0) {
                    state.seriesData = data.tvShows.map(normalizeJSONItem).filter(Boolean);
                    dataLoaded = true;
                    console.log(`✅ TV Shows: ${state.seriesData.length} items`);
                }
                
                // Load all data (gabungan)
                if (data.all && Array.isArray(data.all) && data.all.length > 0) {
                    const allItems = data.all.map(normalizeJSONItem).filter(Boolean);
                    
                    // Isi thriller dengan movie yang memiliki genre thriller/action
                    state.thrillerData = allItems.filter(item => 
                        item.type === 'movie' && 
                        (item.genre.includes('Thriller') || item.genre.includes('Action') || item.genre.includes('Horror'))
                    ).slice(0, 20);
                    
                    if (state.thrillerData.length === 0) {
                        state.thrillerData = state.moviesData.slice(0, 20);
                    }
                    
                    dataLoaded = true;
                    console.log(`✅ All items: ${allItems.length}`);
                }
                
                if (dataLoaded) {
                    // Update cache di localStorage
                    cacheAllDataToLocalStorage();
                    
                    // Render ulang UI
                    setupHeroCarousel();
                    renderAllSections();
                    
                    console.log('✅ Data dari movies.json berhasil dimuat');
                    return true;
                }
                
                return false;
                
            } catch (error) {
                console.warn('⚠️ Gagal load movies.json:', error.message);
                return false;
            }
        }
        
        function normalizeJSONItem(item) {
            if (!item || !item.id) return null;
            
            const title = item.title || item.name || 'Unknown';
            const type = item.type || (item.title ? 'movie' : 'tv');
            const year = item.year || '2026';
            const rating = item.rating || '8.0';
            
            return {
                id: item.id,
                title: title,
                type: type,
                rating: rating,
                year: year,
                genre: item.genre || 'Bioskop',
                overview: item.overview || 'Tidak ada deskripsi tersedia.',
                poster_path: item.poster_path ? 
                    (item.poster_path.startsWith('http') ? item.poster_path : `https://image.tmdb.org/t/p/w500${item.poster_path}`) : 
                    'https://placehold.co/400x600/18181b/ff5c00?text=No+Poster',
                backdrop_path: item.backdrop_path ? 
                    (item.backdrop_path.startsWith('http') ? item.backdrop_path : `https://image.tmdb.org/t/p/w1280${item.backdrop_path}`) : 
                    'https://placehold.co/1200x600/18181b/ff5c00?text=No+Cover',
                popularity: item.popularity || 0,
                vote_count: item.vote_count || 0,
                media_type: type
            };
        }
        
        function cacheAllDataToLocalStorage() {
            try {
                const cacheData = {
                    timestamp: Date.now(),
                    trending: state.trendingData,
                    movies: state.moviesData,
                    series: state.seriesData,
                    thriller: state.thrillerData
                };
                localStorage.setItem('reviewfilm21_data_cache', JSON.stringify(cacheData));
                console.log('✅ Data cached to localStorage');
            } catch (e) {
                console.warn('⚠️ Gagal cache data:', e);
            }
        }
        
        function loadDataFromLocalStorage() {
            try {
                const cached = localStorage.getItem('reviewfilm21_data_cache');
                if (cached) {
                    const data = JSON.parse(cached);
                    
                    // Hanya gunakan cache jika kurang dari 24 jam
                    if (Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
                        if (data.trending?.length) {
                            state.trendingData = data.trending;
                            state.heroItems = data.trending.slice(0, 5);
                        }
                        if (data.movies?.length) state.moviesData = data.movies;
                        if (data.series?.length) state.seriesData = data.series;
                        if (data.thriller?.length) state.thrillerData = data.thriller;
                        
                        console.log('✅ Data loaded from localStorage cache');
                        return true;
                    }
                }
            } catch (e) {
                console.warn('⚠️ Gagal load cache:', e);
            }
            return false;
        }

        // ================= INISIALISASI (UPDATED) =================
        window.onload = async function () {
            updateWatchlistBadge();
            
            let dataLoaded = false;
            
            // 1. Coba load dari localStorage cache (tercepat)
            dataLoaded = loadDataFromLocalStorage();
            
            if (dataLoaded) {
                setupHeroCarousel();
                renderAllSections();
            }
            
            // 2. Coba load dari movies.json (fresh data)
            try {
                const jsonLoaded = await loadMoviesFromJSON();
                if (jsonLoaded) {
                    dataLoaded = true;
                }
            } catch (error) {
                console.warn('⚠️ Gagal load movies.json:', error);
            }
            
            // 3. Jika masih belum ada data, coba fetch langsung dari TMDB
            if (!dataLoaded) {
                console.log('🔄 Fallback: Fetch langsung dari TMDB...');
                await fetchTMDBCatalogs();
            }
            
            // 4. Mulai auto-update (setiap 6 jam)
            startAutoUpdateTMDB();
            
            // 5. Inisialisasi fitur lainnya
            initSmartTvControls();
            handleRoute();
            setTimeout(updateTvFocusables, 500);
            
            // 6. Load library Google Sheets (silent)
            loadLibraryFromGoogleSheets();
            
            hideLoading();
            
            console.log('✅ Aplikasi siap digunakan');
        };

        // ... (semua fungsi lainnya sama seperti sebelumnya) ...
    </script>
