<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewFilm21 - Review Film Terbaru</title>
    <meta name="description" content="Review film terbaru, sinopsis, rating, dan trailer resmi.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff5c00;
            margin-bottom: 30px;
            border-radius: 10px;
        }
        
        .header h1 {
            color: #ff5c00;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #999;
            font-size: 0.9em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            color: #ff5c00;
            margin: 25px 0 15px;
            font-size: 1.3em;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        
        .movie-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #333;
            transition: all 0.3s;
        }
        
        .movie-card:hover {
            transform: translateY(-5px);
            border-color: #ff5c00;
            box-shadow: 0 5px 15px rgba(255,92,0,0.3);
        }
        
        .poster-wrapper {
            position: relative;
            aspect-ratio: 2/3;
            background: #222;
        }
        
        .poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .rating-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            color: #ffd700;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .movie-info {
            padding: 12px;
        }
        
        .movie-title {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .movie-year {
            color: #999;
            font-size: 0.85em;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.2em;
        }
        
        .error {
            background: #2a0a0a;
            color: #ff4444;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .search-bar {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto 20px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 1em;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: #ff5c00;
        }
        
        .search-bar button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: #ff5c00;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #1a1a1a;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #333;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-radius: 15px 15px 0 0;
        }
        
        .close-btn {
            background: #ff5c00;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        
        .video-container {
            aspect-ratio: 16/9;
            background: #000;
        }
        
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-body h2 {
            color: #ff5c00;
            margin-bottom: 10px;
        }
        
        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .modal-meta span {
            background: #222;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }
        
        .modal-overview {
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: #ff5c00;
            color: white;
        }
        
        .btn-youtube {
            background: #ff0000;
            color: white;
        }
        
        .btn-secondary {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 ReviewFilm21</h1>
        <p>Review Film Terbaru • Trailer Resmi • Sinopsis Lengkap</p>
    </div>
    
    <div class="container">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Cari film..." onkeyup="handleSearch(this.value)">
            <button onclick="handleSearch(document.getElementById('search-input').value)">🔍</button>
        </div>
        
        <div id="content">
            <div id="loading" class="loading">⏳ Memuat data film...</div>
        </div>
        
        <div id="movie-grid" class="movie-grid"></div>
    </div>
    
    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Detail Film</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="video-container">
                <iframe id="modal-trailer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="modal-body">
                <h2 id="detail-title">Judul</h2>
                <div class="modal-meta">
                    <span id="detail-rating" style="color: #ffd700;">⭐ 8.0</span>
                    <span id="detail-year">📅 2024</span>
                </div>
                <p class="modal-overview" id="detail-overview">Sinopsis...</p>
                <button class="btn btn-primary" onclick="playTrailer()">🎬 Putar Trailer</button>
                <button class="btn btn-youtube" onclick="openYouTube()">▶ YouTube</button>
            </div>
        </div>
    </div>

    <script>
        // ============ DATA FALLBACK ============
        var fallbackMovies = [
            {
                id: 939243,
                title: "Avatar: Fire and Ash",
                year: "2026",
                rating: 8.9,
                overview: "Lanjutan epik petualangan di Pandora. Jake Sully dan Neytiri menghadapi ancaman baru dari klan Ash People.",
                poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg"
            },
            {
                id: 533535,
                title: "Deadpool & Wolverine",
                year: "2024",
                rating: 8.1,
                overview: "Wade Wilson dan Logan bersatu dalam petualangan multiverse yang kocak dan penuh aksi.",
                poster: "https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg"
            },
            {
                id: 693134,
                title: "Dune: Part Two",
                year: "2024",
                rating: 8.6,
                overview: "Paul Atreides bersatu dengan Chani dan Suku Fremen untuk membalas dendam.",
                poster: "https://image.tmdb.org/t/p/w500/1pdfifyNQrYMH7QCKV4T58I2Aky.jpg"
            },
            {
                id: 1022789,
                title: "Inside Out 2",
                year: "2024",
                rating: 8.5,
                overview: "Emosi baru muncul di benak Riley yang beranjak remaja.",
                poster: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg"
            },
            {
                id: 823464,
                title: "Godzilla x Kong: The New Empire",
                year: "2024",
                rating: 7.8,
                overview: "Dua raksasa legendaris bersatu menghadapi ancaman kolosal.",
                poster: "https://image.tmdb.org/t/p/w500/tMefBSflR6PGQLv7WvFPpKLZkyk.jpg"
            },
            {
                id: 76341,
                title: "Mad Max: Fury Road",
                year: "2015",
                rating: 8.3,
                overview: "Aksi kejar-kejaran tanpa henti melintasi gurun pasca-apokaliptik.",
                poster: "https://image.tmdb.org/t/p/w500/hA2ple9q4qnwxp3hKVNhroipsir.jpg"
            }
        ];
        
        var allMovies = fallbackMovies;
        var currentMovie = null;
        var currentTrailerKey = '';
        var API_KEY = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlOWE0MjVkOWE5NWIxOWNlZWNmNWY3NjM0OTFhMTZhMiIsIm5iZiI6MTc4NjcwODk3NS45NDMsInN1YiI6IjZhN2YwM2VmYWRhZTA1MzllZWI3YTUwMSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.tYWz-uha4q8nvwC1HTDd_KUgjGAdMFSPbOzZrkE3hoY';
        
        // ============ DISPLAY MOVIES ============
        function displayMovies(movies) {
            var loading = document.getElementById('loading');
            var grid = document.getElementById('movie-grid');
            
            if (loading) loading.style.display = 'none';
            
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<p style="color:#999; text-align:center; grid-column: 1/-1; padding: 30px;">Film tidak ditemukan.</p>';
                return;
            }
            
            grid.innerHTML = movies.map(function(movie) {
                return `
                    <div class="movie-card" onclick="openDetail(${movie.id})">
                        <div class="poster-wrapper">
                            <img src="${movie.poster}" alt="${movie.title}" 
                                 onerror="this.src='https://via.placeholder.com/400x600/333333/ffffff?text=No+Poster'">
                            <span class="rating-badge">⭐ ${movie.rating.toFixed ? movie.rating.toFixed(1) : movie.rating}</span>
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${movie.title}</div>
                            <div class="movie-year">${movie.year}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============ FETCH FROM TMDB ============
        function fetchMovies() {
            fetch('https://api.themoviedb.org/3/trending/movie/week?language=id-ID', {
                headers: {
                    'Authorization': 'Bearer ' + API_KEY,
                    'accept': 'application/json'
                }
            })
            .then(function(response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(function(data) {
                if (data.results && data.results.length > 0) {
                    allMovies = data.results.slice(0, 12).map(function(movie) {
                        return {
                            id: movie.id,
                            title: movie.title,
                            year: movie.release_date ? movie.release_date.split('-')[0] : 'TBA',
                            rating: movie.vote_average || 8.0,
                            overview: movie.overview || 'Tidak ada sinopsis.',
                            poster: movie.poster_path 
                                ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path
                                : 'https://via.placeholder.com/400x600/333333/ffffff?text=No+Poster'
                        };
                    });
                }
                displayMovies(allMovies);
            })
            .catch(function(error) {
                console.log('Menggunakan fallback:', error.message);
                allMovies = fallbackMovies;
                displayMovies(allMovies);
            });
        }
        
        // ============ SEARCH ============
        function handleSearch(query) {
            var q = query.toLowerCase().trim();
            if (!q) {
                displayMovies(allMovies);
                return;
            }
            var results = allMovies.filter(function(movie) {
                return movie.title.toLowerCase().indexOf(q) > -1;
            });
            displayMovies(results);
        }
        
        // ============ MODAL DETAIL ============
        function openDetail(movieId) {
            var movie = allMovies.find(function(m) { return m.id === movieId; });
            if (!movie) return;
            
            currentMovie = movie;
            
            document.getElementById('modal-title').textContent = movie.title;
            document.getElementById('detail-title').textContent = movie.title;
            document.getElementById('detail-rating').textContent = '⭐ ' + (movie.rating.toFixed ? movie.rating.toFixed(1) : movie.rating);
            document.getElementById('detail-year').textContent = '📅 ' + movie.year;
            document.getElementById('detail-overview').textContent = movie.overview;
            
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Fetch trailer
            fetchTrailer(movie.id);
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('modal-trailer').src = '';
            currentTrailerKey = '';
        }
        
        function fetchTrailer(movieId) {
            var iframe = document.getElementById('modal-trailer');
            iframe.src = '';
            currentTrailerKey = '';
            
            fetch('https://api.themoviedb.org/3/movie/' + movieId + '/videos?language=id-ID', {
                headers: {
                    'Authorization': 'Bearer ' + API_KEY,
                    'accept': 'application/json'
                }
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                var trailer = null;
                if (data.results) {
                    trailer = data.results.find(function(v) { return v.type === 'Trailer' && v.site === 'YouTube'; })
                          || data.results.find(function(v) { return v.site === 'YouTube'; });
                }
                if (trailer) {
                    currentTrailerKey = trailer.key;
                    iframe.src = 'https://www.youtube.com/embed/' + trailer.key;
                }
            })
            .catch(function() {
                // Try English
                fetch('https://api.themoviedb.org/3/movie/' + movieId + '/videos?language=en-US', {
                    headers: {
                        'Authorization': 'Bearer ' + API_KEY,
                        'accept': 'application/json'
                    }
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    var trailer = null;
                    if (data.results) {
                        trailer = data.results.find(function(v) { return v.type === 'Trailer' && v.site === 'YouTube'; })
                              || data.results.find(function(v) { return v.site === 'YouTube'; });
                    }
                    if (trailer) {
                        currentTrailerKey = trailer.key;
                        iframe.src = 'https://www.youtube.com/embed/' + trailer.key;
                    }
                })
                .catch(function() {});
            });
        }
        
        function playTrailer() {
            if (currentTrailerKey) {
                document.getElementById('modal-trailer').src = 'https://www.youtube.com/embed/' + currentTrailerKey + '?autoplay=1';
            } else {
                alert('Trailer tidak tersedia untuk film ini.');
            }
        }
        
        function openYouTube() {
            if (currentTrailerKey) {
                window.open('https://www.youtube.com/watch?v=' + currentTrailerKey, '_blank');
            } else {
                alert('Trailer tidak tersedia.');
            }
        }
        
        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        
        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeModal();
        });
        
        // ============ INIT ============
        window.onload = function() {
            fetchMovies();
        };
    </script>
</body>
</html>
