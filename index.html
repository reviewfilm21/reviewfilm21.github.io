<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewFilm21 - Review Film Terbaru Sub Indo</title>
    <meta name="description" content="Review film terbaru, sinopsis, rating, dan trailer resmi. Baca review sebelum nonton di bioskop.">
    <meta name="robots" content="index, follow">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: white;
            min-height: 100vh;
        }
        
        .header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff5c00;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            color: #ff5c00;
            font-size: 2em;
        }
        
        .header p {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .section-title {
            color: #ff5c00;
            margin: 30px 0 15px;
            font-size: 1.5em;
        }
        
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .movie-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            border: 1px solid #333;
        }
        
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,92,0,0.3);
        }
        
        .movie-poster-wrapper {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
        }
        
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .movie-card:hover .play-overlay {
            opacity: 1;
        }
        
        .play-button {
            width: 50px;
            height: 50px;
            background: #ff5c00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }
        
        .movie-info {
            padding: 12px;
        }
        
        .movie-title {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 0.85em;
        }
        
        .rating {
            color: #ffd700;
            font-weight: bold;
        }
        
        /* Modal Detail */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal.active {
            display: block;
        }
        
        .modal-content {
            max-width: 800px;
            margin: 20px auto;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-bottom: 1px solid #333;
        }
        
        .close-btn {
            background: #ff5c00;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        
        .video-container {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
        }
        
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .modal-body {
            padding: 20px;
        }
        
        .modal-body h2 {
            color: #ff5c00;
            margin-bottom: 10px;
        }
        
        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            color: #999;
            font-size: 0.9em;
        }
        
        .modal-overview {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #ff4444;
            background: #2a0a0a;
            border-radius: 10px;
            max-width: 600px;
            margin: 20px auto;
        }
        
        .search-bar {
            max-width: 500px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 1em;
        }
        
        .search-bar input:focus {
            outline: none;
            border-color: #ff5c00;
        }
        
        .search-bar button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background: #ff5c00;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        .search-bar button:hover {
            background: #e04e00;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 ReviewFilm21</h1>
        <p>Review Film & Series Terbaru - Klik untuk lihat detail dan trailer</p>
    </div>
    
    <div class="container">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Cari judul film..." onkeyup="searchMovies(this.value)">
            <button onclick="searchMovies(document.getElementById('search-input').value)">🔍 Cari</button>
        </div>
        
        <!-- Movie Grid -->
        <h2 class="section-title">🔥 Trending Movies</h2>
        <div id="movie-grid" class="movie-grid"></div>
        <div id="loading" class="loading">⏳ Memuat data film...</div>
    </div>
    
    <!-- Modal Detail -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Judul Film</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="video-container">
                <iframe id="trailer-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="modal-body">
                <h2 id="detail-title">Judul Film</h2>
                <div class="modal-meta">
                    <span id="detail-rating" class="rating">★ 8.0</span>
                    <span id="detail-year">2024</span>
                </div>
                <p id="detail-overview" class="modal-overview">Sinopsis film...</p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="playTrailer()" style="padding: 12px 25px; background: #ff5c00; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">
                        🎬 Putar Trailer
                    </button>
                    <button onclick="openYouTube()" style="padding: 12px 25px; background: #ff0000; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold;">
                        ▶ Buka di YouTube
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJlOWE0MjVkOWE5NWIxOWNlZWNmNWY3NjM0OTFhMTZhMiIsIm5iZiI6MTc4NjcwODk3NS45NDMsInN1YiI6IjZhN2YwM2VmYWRhZTA1MzllZWI3YTUwMSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.tYWz-uha4q8nvwC1HTDd_KUgjGAdMFSPbOzZrkE3hoY';
        
        let allMovies = [];
        let currentMovie = null;
        let currentTrailerKey = '';
        
        const movieGrid = document.getElementById('movie-grid');
        const loading = document.getElementById('loading');
        const modal = document.getElementById('modal');
        
        // Data fallback
        const fallbackMovies = [
            {
                id: 939243,
                title: "Avatar: Fire and Ash",
                year: "2026",
                rating: 8.9,
                overview: "Lanjutan epik petualangan di Pandora dengan visual memukau dan pertempuran klan baru.",
                poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg"
            },
            {
                id: 533535,
                title: "Deadpool & Wolverine",
                year: "2024",
                rating: 8.1,
                overview: "Duet kocak dan brutal antara Wade Wilson dan Logan menyelamatkan multiverse.",
                poster: "https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg"
            },
            {
                id: 693134,
                title: "Dune: Part Two",
                year: "2024",
                rating: 8.6,
                overview: "Paul Atreides bersatu dengan Chani dan Suku Fremen dalam misi balas dendam.",
                poster: "https://image.tmdb.org/t/p/w500/1pdfifyNQrYMH7QCKV4T58I2Aky.jpg"
            },
            {
                id: 1022789,
                title: "Inside Out 2",
                year: "2024",
                rating: 8.5,
                overview: "Emosi baru muncul di benak Riley yang beranjak remaja: Kecemasan, Kebosanan, dan Iri.",
                poster: "https://image.tmdb.org/t/p/w500/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg"
            },
            {
                id: 823464,
                title: "Godzilla x Kong: The New Empire",
                year: "2024",
                rating: 7.8,
                overview: "Dua raksasa legendaris kembali bersatu menghadapi ancaman kolosal bawah tanah.",
                poster: "https://image.tmdb.org/t/p/w500/tMefBSflR6PGQLv7WvFPpKLZkyk.jpg"
            },
            {
                id: 76341,
                title: "Mad Max: Fury Road",
                year: "2015",
                rating: 8.3,
                overview: "Aksi kejar-kejaran tanpa henti melintasi gurun pasca-apokaliptik.",
                poster: "https://image.tmdb.org/t/p/w500/hA2ple9q4qnwxp3hKVNhroipsir.jpg"
            }
        ];
        
        // Fetch trending movies
        async function fetchMovies() {
            try {
                const response = await fetch(
                    'https://api.themoviedb.org/3/trending/movie/week?language=id-ID',
                    {
                        headers: {
                            'Authorization': `Bearer ${API_KEY}`,
                            'accept': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    allMovies = data.results.slice(0, 12).map(movie => ({
                        id: movie.id,
                        title: movie.title,
                        year: movie.release_date ? movie.release_date.split('-')[0] : 'TBA',
                        rating: movie.vote_average || 8.0,
                        overview: movie.overview || 'Tidak ada sinopsis.',
                        poster: movie.poster_path 
                            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
                            : 'https://via.placeholder.com/500x750/333333/ffffff?text=No+Poster'
                    }));
                    displayMovies(allMovies);
                } else {
                    allMovies = fallbackMovies;
                    displayMovies(allMovies);
                }
                
            } catch (error) {
                console.log('Menggunakan data fallback:', error.message);
                allMovies = fallbackMovies;
                displayMovies(allMovies);
            }
        }
        
        // Display movies in grid
        function displayMovies(movies) {
            loading.style.display = 'none';
            
            if (movies.length === 0) {
                movieGrid.innerHTML = '<p style="color:#999; text-align:center; grid-column: 1/-1;">Film tidak ditemukan.</p>';
                return;
            }
            
            movieGrid.innerHTML = movies.map(movie => `
                <div class="movie-card" onclick="openDetail(${movie.id})">
                    <div class="movie-poster-wrapper">
                        <img src="${movie.poster}" alt="${movie.title}" 
                             onerror="this.src='https://via.placeholder.com/500x750/333333/ffffff?text=No+Poster'">
                        <div class="play-overlay">
                            <div class="play-button">▶</div>
                        </div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating">★ ${movie.rating.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Search movies
        function searchMovies(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                displayMovies(allMovies);
                return;
            }
            const results = allMovies.filter(movie => 
                movie.title.toLowerCase().includes(q)
            );
            displayMovies(results);
        }
        
        // Open detail modal
        async function openDetail(movieId) {
            const movie = allMovies.find(m => m.id === movieId);
            if (!movie) return;
            
            currentMovie = movie;
            
            // Update modal content
            document.getElementById('modal-title').textContent = movie.title;
            document.getElementById('detail-title').textContent = movie.title;
            document.getElementById('detail-rating').textContent = `★ ${movie.rating.toFixed(1)}`;
            document.getElementById('detail-year').textContent = movie.year;
            document.getElementById('detail-overview').textContent = movie.overview;
            
            // Show modal
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Fetch trailer
            await fetchTrailer(movie.id);
        }
        
        // Fetch trailer from YouTube
        async function fetchTrailer(movieId) {
            const iframe = document.getElementById('trailer-iframe');
            iframe.src = '';
            currentTrailerKey = '';
            
            try {
                const response = await fetch(
                    `https://api.themoviedb.org/3/movie/${movieId}/videos?language=id-ID`,
                    {
                        headers: {
                            'Authorization': `Bearer ${API_KEY}`,
                            'accept': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                
                let trailer = data.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube') 
                           || data.results?.find(v => v.site === 'YouTube');
                
                if (!trailer) {
                    // Try English
                    const enResponse = await fetch(
                        `https://api.themoviedb.org/3/movie/${movieId}/videos?language=en-US`,
                        {
                            headers: {
                                'Authorization': `Bearer ${API_KEY}`,
                                'accept': 'application/json'
                            }
                        }
                    );
                    const enData = await enResponse.json();
                    trailer = enData.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube')
                          || enData.results?.find(v => v.site === 'YouTube');
                }
                
                if (trailer) {
                    currentTrailerKey = trailer.key;
                    iframe.src = `https://www.youtube.com/embed/${trailer.key}`;
                } else {
                    iframe.src = '';
                }
                
            } catch (error) {
                console.log('Gagal fetch trailer:', error.message);
            }
        }
        
        // Play trailer
        function playTrailer() {
            if (currentTrailerKey) {
                const iframe = document.getElementById('trailer-iframe');
                iframe.src = `https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1`;
            } else {
                alert('Trailer tidak tersedia untuk film ini.');
            }
        }
        
        // Open in YouTube
        function openYouTube() {
            if (currentTrailerKey) {
                window.open(`https://www.youtube.com/watch?v=${currentTrailerKey}`, '_blank');
            } else {
                alert('Trailer tidak tersedia.');
            }
        }
        
        // Close modal
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('trailer-iframe').src = '';
            currentTrailerKey = '';
        }
        
        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        // Initialize
        window.onload = fetchMovies;
    </script>
</body>
</html>
